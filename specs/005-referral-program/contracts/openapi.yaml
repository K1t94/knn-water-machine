openapi: 3.1.0
info:
  title: Kaynann Referral Public API
  version: 0.2.0
  description: Public availability and authenticated inviter-only referral reads.
servers:
  - url: /
paths:
  /v1/app-config:
    get:
      operationId: getPublicAppConfig
      summary: Get privacy-safe runtime feature availability
      security: []
      responses:
        "200":
          description: Current authoritative public availability
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfigResponseDto"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/referrals/me:
    get:
      operationId: getMyReferral
      summary: Get the authenticated user's referral code and inviter summary
      security:
        - AccessBearer: []
      responses:
        "200":
          description: Referral information owned by the authenticated user
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReferralResponseDto"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ReferralUnavailable"
  /v1/referrals/invitations:
    get:
      operationId: getMyReferralInvitations
      summary: Get credited inviter bonus history
      security:
        - AccessBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Newest-first credited invitations
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralInvitationPageResponseDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ReferralUnavailable"
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    NoStore:
      schema:
        type: string
        const: no-store
  schemas:
    AppConfigResponseDto:
      type: object
      additionalProperties: false
      required: [features]
      properties:
        features:
          $ref: "#/components/schemas/PublicFeatureAvailabilityDto"
    PublicFeatureAvailabilityDto:
      type: object
      additionalProperties: false
      required: [referralProgramEnabled]
      properties:
        referralProgramEnabled:
          type: boolean
    MyReferralResponseDto:
      type: object
      additionalProperties: false
      required: [promoCode, referralLink, currentInviterRewardMl, creditedInviterBonusMl, creditedInvitationCount]
      properties:
        promoCode:
          type: string
          pattern: "^[23456789ABCDEFGHJKMNPQRSTVWXYZ]{12}$"
        referralLink:
          type: string
          pattern: "^kaynann://register\\?promo=[23456789ABCDEFGHJKMNPQRSTVWXYZ]{12}$"
        creditedInvitationCount:
          type: integer
          minimum: 0
        creditedInviterBonusMl:
          $ref: "#/components/schemas/Millilitres"
        currentInviterRewardMl:
          $ref: "#/components/schemas/Millilitres"
    ReferralInvitationResponseDto:
      type: object
      additionalProperties: false
      required: [id, inviteeLabel, appliedAt, status, creditedAmountMl]
      properties:
        id:
          type: string
          format: uuid
        inviteeLabel:
          type: string
          pattern: "^\\*\\*[0-9]{0,2}$"
        appliedAt:
          type: string
          format: date-time
        status:
          type: string
          const: CREDITED
        creditedAmountMl:
          $ref: "#/components/schemas/Millilitres"
    ReferralInvitationPageResponseDto:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReferralInvitationResponseDto"
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 512
        hasMore:
          type: boolean
    Millilitres:
      type: string
      pattern: "^[0-9]+$"
      description: Exact non-negative whole millilitres encoded as a decimal string.
    ReferralPublicErrorResponseDto:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId]
          properties:
            code:
              type: string
              enum:
                - FEATURE_DISABLED
                - REFERRAL_CODE_UNAVAILABLE
                - REFERRAL_SELF_NOT_ALLOWED
                - REFERRAL_SERVICE_UNAVAILABLE
                - REFERRAL_CURSOR_INVALID
            message:
              type: string
              maxLength: 200
            retryable:
              type: boolean
            requestId:
              type: string
              maxLength: 128
    AuthErrorResponseDto:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, requestId]
          properties:
            code:
              type: string
              enum:
                - INVALID_PHONE
                - UNSUPPORTED_COUNTRY
                - RATE_LIMITED
                - SMS_BUDGET_EXHAUSTED
                - SMS_CONFIGURATION_ERROR
                - SMS_AUTH_FAILED
                - SMS_BALANCE_EXHAUSTED
                - SMS_PROVIDER_RATE_LIMITED
                - SMS_INVALID_RECIPIENT
                - SMS_REJECTED
                - SMS_TIMEOUT
                - SMS_TEMPORARILY_UNAVAILABLE
                - OTP_INVALID
                - OTP_EXPIRED
                - OTP_USED
                - OTP_ATTEMPTS_EXHAUSTED
                - REGISTRATION_AUTH_INVALID
                - REGISTRATION_AUTH_EXPIRED
                - LEGAL_VERSION_STALE
                - REFERRAL_CODE_UNAVAILABLE
                - REFERRAL_SELF_NOT_ALLOWED
                - REFERRAL_ALREADY_ATTACHED
                - REFERRAL_SERVICE_UNAVAILABLE
                - DEPENDENCY_UNAVAILABLE
                - SESSION_CREATION_FAILED
                - REFRESH_INVALID
                - REFRESH_EXPIRED
                - REFRESH_REPLAYED
            message:
              type: string
            retryable:
              type: boolean
            retryAfterSeconds:
              type: integer
              minimum: 1
            requestId:
              type: string
              maxLength: 128
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReferralPublicErrorResponseDto"
    Unauthorized:
      description: Valid access session required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorResponseDto"
    ServiceUnavailable:
      description: Authoritative configuration is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReferralPublicErrorResponseDto"
          example:
            error:
              code: REFERRAL_SERVICE_UNAVAILABLE
              message: Service is temporarily unavailable.
              retryable: true
              requestId: request-id
    ReferralUnavailable:
      description: Referral feature is disabled or temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReferralPublicErrorResponseDto"
          examples:
            disabled:
              value:
                error:
                  code: FEATURE_DISABLED
                  message: Referral program is disabled.
                  retryable: false
                  requestId: request-id
            unavailable:
              value:
                error:
                  code: REFERRAL_SERVICE_UNAVAILABLE
                  message: Service is temporarily unavailable.
                  retryable: true
                  requestId: request-id
